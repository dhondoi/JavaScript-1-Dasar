<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Overiding Method</title>
  </head>
  <body>
    <script>
      class Mail {
        constructor(phone) {
          this.phone = phone;
        }
      }

      class WhatsApp extends Mail {
        constructor(username, isBussinessAccount, phone) {
          super();
          this.username = username;
          this.isBussinessAccount = isBussinessAccount;
        }
        myProfile() {
          return `my name ${this.username}, is ${this.isBussinessAccount ? "Business" : "Personal"}`;
        }
      }

      const wa1 = new WhatsApp("dicoding", true, 89989090898);
      console.log(wa1.myProfile());
      // my name dicoding, is Business
    </script>
  </body>
</html>
