<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class</title>
  </head>
  <body>
    <script>
      // membuat class
      class Mail {
        // private property
        #name = "Doni";
        // global property
        from = "pengirim@dicoding.com";
        constructor() {
          name = "a";
        }
        // global funtion
        sendMessage(msg, to) {
          console.log(`you send: ${msg} to ${to} from ${name}`);
        }
        // static function
        static isValidPhone() {
          return "static";
        }
        // private method
        #getTotal() {
          return 10;
        }
        getTotalGlobal() {
          return this.#getTotal();
        }
        // get private property name
        getName() {
          return name;
        }
      }
      // instasiasi
      const mail1 = new Mail();
      mail1.sendMessage("hallo", "penerima@dicoding.com", "doni");
      console.log(Mail.isValidPhone());
      console.log(mail1.getTotalGlobal());
    </script>
  </body>
</html>
