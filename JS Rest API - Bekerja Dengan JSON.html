    <script>

        //menggunakan ajax
        $.each(menu, function (index, data) {
          $(".row:nth-child(2)").append(
            '<div class="col-md-4">' +
              '<div class="card mb-3"><img src="./img/menu/' +
              data.gambar +
              '" class="card-img-top">' +
              '<div class="card-body">' +
              '<h5 class="card-title">' +
              data.nama +
              "</h5>" +
              '<p class="card-text">' +
              data.deskripsi +
              "</p>" +
              '<h5 class="card-title">Rp. ' +
              data.harga +
              ",-</h5>" +
              '<a href="#" class="btn btn-primary">Pesan Sekarang</a>' +
              "</div>" +
              "</div>" +
              "</div>"
          );
        });
      });

      $(".nav-link").on("click", function () {
        $(".nav-link").removeClass("active");
        $(this).addClass("active");
        let kategori = $(this).html();
        $("h1").html(kategori);
        $.getJSON("./donihut.json", function (params) {
          let menu = params.menu;
          let content = "";
          $.each(menu, function (i, data) {
            if (data.kategori == kategori.toLowerCase() || kategori == "All Menu") {
              content +=
                '<div class="col-md-4">' +
                '<div class="card mb-3"><img src="./img/menu/' +
                data.gambar +
                '" class="card-img-top">' +
                '<div class="card-body">' +
                '<h5 class="card-title">' +
                data.nama +
                "</h5>" +
                '<p class="card-text">' +
                data.deskripsi +
                "</p>" +
                '<h5 class="card-title">Rp. ' +
                data.harga +
                ",-</h5>" +
                '<a href="#" class="btn btn-primary">Pesan Sekarang</a>' +
                "</div>" +
                "</div>" +
                "</div>";
            }
          });
          $(".row:nth-child(2)").html(content);
        });
      });
    </script>
