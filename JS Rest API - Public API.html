<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />

  <title>Public API</title>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Dhondoi Movies</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-item nav-link active" href="#">Search Movie</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row mt-3">
      <div class="col-sm-12">
        <h1>Search Movie</h1>
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Input Name of Movie" id="search-input" />
          <div class="input-group-append">
            <button class="btn btn-dark" type="button" id="search-button">
              Search
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="row" id="list-movies"></div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">...</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Close
          </button>
          <button type="button" class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Optional JavaScript; choose one of the two! -->

  <!-- Option 1: Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <script>
    function searcMovies() {
      $("#list-movies").html("");
      $.ajax({
        url: "http://www.omdbapi.com",
        type: "get",
        dataType: "json",
        data: {
          apikey: "9a3f3566",
          s: $("#search-input").val(),
        },
        success: function (result) {
          if (result.Response == "True") {
            let movies = result.Search;
            $.each(movies, function (i, data) {
              $(
                "#list-movies"
              ).append(/*HTML*/ `<div class="card" style="width: 18rem;">
    <img class="card-img-top" src="${data.Poster}" alt="Card image cap">
    <div class="card-body">
    <h5 class="card-title">${data.Title}</h5>
    <p class="card-text">${data.Year}</p>
    <a href="#" class="card-link" data-bs-toggle="modal" data-bs-target="#exampleModal" data-id="${data.imdbID}" >See Detail</a>
  </div>
  </div>`);
            });
            $("#search-input").val("");
          } else {
            $("#list-movies").html("<h1>" + result.Error + "</h1>");
          }
        },
      });
    }

    $("#search-button").on("click", function () {
      searcMovies();
    });
    $("#search-input").on("keyup", function (params) {
      if (params.keyCode == 13) {
        searcMovies();
      }
    });
    $("#list-movies").on("click", ".card-link", function () {
      $.ajax({
        url: "http://www.omdbapi.com",
        type: "get",
        dataType: "json",
        data: {
          apikey: "9a3f3566",
          i: $(this).data("id"),
        },
        success: function (movie) {
          if (movie.Response == "True") {
            $(".modal-body").html(/*html*/ `
                <div class="container-fluid">
                  <div class="row">
                    <div class="col-md-4">
                      <img src="${movie.Poster}" class="img-fluid" />
                    </div>
                    <div class="col-md-8">
                      <ul class="list-group">
                        <li class="list-group-item"><h3> ${movie.Title}<h3></li>
                        <li class="list-group-item">Released : ${movie.Released}</li>
                        <li class="list-group-item">Genre : ${movie.Genre}</li>
                        <li class="list-group-item">Director : ${movie.Director}</li>
                        <li class="list-group-item">Actors : ${movie.Actors}</li>
                      </ul>
                    </div>
                  </div>
                </div>
                `);
          }
        },
      });
    });
  </script>
  <!-- Option 2: Separate Popper and Bootstrap JS -->
  <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    -->
</body>

</html>
