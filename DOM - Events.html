<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DOM Event</title>
    <style>
      * {
        border: 2px solid #dedede;
        padding: 15px;
        margin: 15px;
      }
      html {
        margin: 0;
        padding: 0;
      }
      body {
        max-width: 600px;
        margin: 30px auto;
        font-family: sans-serif;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1 id="judul">Hello World</h1>
    <div id="container">
      <section id="a">
        <p class="p1" onclick="setColorP1()">paragraf 1</p>
        <a href="http://instagram.com/sandhikagalih"
          >Instagram Sandhika Galih</a
        >
        <p class="p2">paragraf 2</p>
        <p class="p3">paragraf 3</p>
      </section>
      <section id="b">
        <p>paragraf 4</p>
        <ul>
          <li>item 1</li>
          <li>item 2</li>
          <li>item 3</li>
        </ul>
      </section>
    </div>

    <script>
      /*
      Event Handler
      */
      //Inline HTML attribute
      function setColorP1() {
        document.getElementsByClassName("p1")[0].style.backgroundColor =
          "lightblue";
      }
      //Element method
      const p2 = document.querySelector(".p2");
      p2.onclick = setColorP2;
      function setColorP2() {
        p2.style.backgroundColor = "lightblue";
      }

      /*
      addEventListener()
      */
      const p4 = document.querySelector("section#b p");
      p4.addEventListener("click", function () {
        const ul = document.querySelector("section#b ul");
        const listBaru = document.createElement("li");
        const textLiBaru = document.createTextNode("List Baru");
        listBaru.appendChild(textLiBaru);
        ul.appendChild(listBaru);
      });
    </script>
  </body>
</html>
